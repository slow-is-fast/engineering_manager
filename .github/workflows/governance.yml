name: governance

# AASEGS v1.1.1 §12.3 要求的自检：任何对规范、注册表、控制目录的改动
# 都必须通过静态校验、单元测试与静态负向用例，否则不得合并。
# 这不是运行时控制；它的作用是阻止文档层漂移（QA-02 / BASE-01 的最小实现）。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Control catalog & rule registry lint
        run: python scripts/validate_controls.py

      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Static negative tests (T-REG-01 / T-REG-02 / T-AUD-01)
        run: python tests/negative_static.py

      - name: T-VD-01 executor pin verification (control plane: aasegs-gov-plane)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/verify_executor_pin.py
