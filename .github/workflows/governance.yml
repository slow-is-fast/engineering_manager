name: governance

# AASEGS v1.1.1 §12.3 要求的自检：任何对规范、注册表、控制目录的改动
# 都必须通过静态校验、单元测试与静态负向用例，否则不得合并。
# 这不是运行时控制；它的作用是阻止文档层漂移（QA-02 / BASE-01 的最小实现）。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Control catalog & rule registry lint
        run: python scripts/validate_controls.py

      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Static negative tests (T-REG-01 / T-REG-02 / T-AUD-01)
        run: python tests/negative_static.py

      - name: "T-VD-01 executor pin verification (control plane: aasegs-gov-plane)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/verify_executor_pin.py

      - name: "T-VD-01b credential domain check (data-plane token must not write control plane)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/verify_credential_domain.py --expect-deny

      # RVF-01：证据过期即失败关闭（P0 30 天 / P1 90 天 / P2 180 天）。
      # 到期后重新验证并更新 control-catalog.yaml 中各控制的 evidence_at 即可复绿。
      - name: "T-RVF-01 evidence freshness (stale evidence fails closed)"
        run: python scripts/verify_evidence_freshness.py --enforce

      # GATE-01：成熟度/风险等级准入判定。CI 采用防退化下限而非"必须达标 G2"：
      # 下限是 Owner 实际达到并批准的最低等级。报告里 DENY 是门槛的正确结论
      # （当前账本不满足更高等级是事实），不算失败；跌破 G1（输入损坏/事实源
      # 冲突/证据过期/目录失守）才变红——这是防退化，不是伪装达标。
      - name: "T-GATE-01 admission gate evaluation (anti-regression floor: G1)"
        run: |
          python scripts/check_admission_gate.py
          python scripts/check_admission_gate.py --require-level G1
